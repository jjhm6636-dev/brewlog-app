<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BREW LOG</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#fff9ee">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="BREW LOG">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<style>
/* VOICE: 지윤 님의 BREW LOG 시안을 그대로 옮긴, 차분하고 따뜻한 카페 기록 앱
   IDEA: 카페 다이어리 — 한 잔씩 쌓여 이달의 요약, 사진첩, 작년의 기억이 되는 기록장
   PICTURE: 시작 화면은 카페 인테리어, 메인 홈은 라테 한 잔 장면 위에 문구와 테라코타 버튼
   COLOUR and TYPE: 크림 #fff9ee, 잉크 #1f1a17, 테라코타 #b94b32, 카드 베이지 #f8eedd / Noto Sans KR, 로고는 자간 넓은 굵은 대문자
   LAYOUT: 모바일 한 화면(최대 430px), 섹션 제목+전체보기 줄, 하단 4탭 */
:root{color-scheme:light;
--bg:light-dark(#fff9ee,#16120f);--card:light-dark(#ffffff,#241d18);--ink:light-dark(#1f1a17,#f5ecdf);
--sub:light-dark(#8a7a6b,#b3a291);--line:light-dark(#e9dccb,#382c23);--soft:light-dark(#f8eedd,#2a211b);
--chip:light-dark(#e6ddd2,#3a2f27);--rust:#b94b32;--rust-ink:light-dark(#b94b32,#e57a5e);--esp:light-dark(#2a201a,#f5ecdf);--on-esp:light-dark(#fff9ee,#16120f);--off:light-dark(#dcd6cf,#4a3f36)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:light}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:light-dark(#efe5d6,#0d0b09);color:var(--ink);font:16px/1.55 "Noto Sans KR",system-ui,sans-serif;overflow-x:clip}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--rust);outline-offset:2px}
.app{max-width:430px;margin:0 auto;min-height:100vh;background:var(--bg);position:relative;padding-bottom:100px}
header{position:sticky;top:0;z-index:4;background:var(--bg);display:flex;align-items:center;justify-content:space-between;padding:8px 10px 6px 20px}
.logo{font-weight:900;font-size:clamp(24px,7.5vw,31px);letter-spacing:.16em;line-height:1}
header.center{display:grid;grid-template-columns:48px 1fr 48px;padding-left:10px}
header.center .logo{grid-column:2;text-align:center;font-size:20px;font-weight:800;letter-spacing:.22em;padding-left:.22em}
.icon-btn{border:0;background:none;width:48px;height:48px;display:grid;place-items:center;padding:0;color:var(--ink)}
.view{display:none}.view.on{display:block}
.ico{width:20px;height:20px;flex:none}

/* 히어로 */
.hero{position:relative;margin:4px 20px 0;overflow:hidden;background:#cbb89f}
.hero.tall{aspect-ratio:348/478}.hero.main{aspect-ratio:348/298;overflow:visible;background:none}
.hero .pic{position:absolute;inset:0;overflow:hidden;background:#3c342e}
.hero.main .pic{bottom:22px}
.hero .pic>svg,.hero .pic>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.hero .pic::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(30,20,14,.35) 0%,rgba(30,20,14,.15) 45%,rgba(30,20,14,.3) 100%)}
.copy{position:absolute;z-index:1;left:12px;right:12px;color:#fff}
.hero.tall .copy{top:42px}.hero.main .copy{top:34%}
.copy h1{margin:0;font-size:clamp(26px,7.6vw,31px);line-height:1.3;font-weight:500;text-wrap:balance;text-shadow:0 1px 8px rgba(0,0,0,.25)}
.copy p{margin:6px 0 0;font-size:13px;opacity:.95}
.cta{position:absolute;z-index:2;left:0;right:0;min-height:46px;border:0;border-radius:99px;background:var(--rust);color:#fff;font-size:16px;font-weight:500;box-shadow:0 8px 20px rgba(120,40,20,.25);display:flex;align-items:center;justify-content:center;gap:10px;transition:transform .15s}
.hero.tall .cta{bottom:30px}.hero.main .cta{bottom:0}
.cta:active,.cta2:active{transform:scale(.98)}
.cta2{display:flex;align-items:center;justify-content:center;gap:10px;width:calc(100% - 40px);margin:22px 20px 0;min-height:46px;border:0;border-radius:14px;background:var(--rust);color:#fff;font-weight:500;font-size:15px}
.peek{display:block;margin:14px auto 0;border:0;background:none;color:var(--sub);font-size:14px;text-decoration:underline;min-height:44px}

/* 섹션 */
.sec{padding:30px 20px 0}
.sec-h{display:flex;justify-content:space-between;align-items:center;margin:0 0 10px;gap:8px}
.sec-h h2{margin:0;font-size:17px;font-weight:700}
.more{border:0;background:none;color:var(--sub);font-size:13px;min-height:40px;padding:0 2px;display:flex;align-items:center;gap:4px;white-space:nowrap}
.rule{border-top:1px solid var(--ink);opacity:1}
.visit{display:grid;grid-template-columns:114px minmax(0,1fr) 20px;gap:26px;align-items:center;width:100%;padding:16px 0;border:0;border-bottom:1px solid var(--line);background:none;text-align:left}
.visit img{width:114px;aspect-ratio:114/80;object-fit:cover;border-radius:12px;display:block}
.visit .d{font-size:13px;color:var(--sub)}
.visit .n{font-size:14px;margin-top:2px}
.visit .a{font-size:13px;margin-top:2px}
.chev{color:var(--sub);font-size:20px;line-height:1}
.rating{display:flex;align-items:center;gap:8px;margin-top:2px}
.st{font-size:22px;letter-spacing:2px;line-height:1;background:linear-gradient(90deg,var(--rust) var(--p),var(--off) var(--p));-webkit-background-clip:text;background-clip:text;color:transparent}
.st.sm{font-size:15px;letter-spacing:1px}
.rating small{font-size:13px}
.month{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));background:var(--soft);border-radius:16px;padding:16px 4px}
.month>div{display:flex;align-items:center;justify-content:center;gap:6px;padding:0 4px;border-left:1px solid var(--line)}
.month>div:first-child{border-left:0}
.badge{width:28px;height:28px;border-radius:50%;background:var(--rust);color:#fff;display:grid;place-items:center;flex:none}
.badge svg{width:17px;height:17px}
.month .t{font-size:12px;line-height:1.3;white-space:nowrap}
.month b{display:block;font-size:16px;color:var(--rust-ink);white-space:nowrap}
.month b.k{color:var(--ink)}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.grid3 button{border:0;padding:0;background:var(--line);aspect-ratio:108/93;overflow:hidden}
.grid3 img{width:100%;height:100%;object-fit:cover;display:block}
.tags{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.tg{border:0;border-radius:99px;background:var(--chip);min-height:32px;padding:0 4px;font-size:13px;white-space:nowrap}
.tg.on{background:var(--rust);color:#fff}
.saved{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.sv{background:var(--soft);border-radius:10px;overflow:hidden;text-align:left;border:0;padding:0;position:relative}
.sv img{width:100%;aspect-ratio:168/78;object-fit:cover;display:block}
.sv .b{padding:8px 8px 10px}
.sv b{font-size:14px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sv .ad{font-size:12px;color:var(--sub);display:flex;gap:3px;align-items:flex-start;line-height:1.35}
.sv .sc{font-size:13px;margin-top:3px}.sv .sc i{font-style:normal;color:var(--rust)}
.mark{position:absolute;top:6px;right:6px;width:32px;height:32px;border-radius:50%;border:0;background:rgba(255,255,255,.9);display:grid;place-items:center;color:#1f1a17;padding:0}
.mem{display:grid;grid-template-columns:124px minmax(0,1fr) 16px;gap:12px;align-items:center;background:var(--soft);border-radius:12px;overflow:hidden;width:100%;border:0;padding:0 10px 0 0;text-align:left}
.mem img{width:124px;aspect-ratio:124/116;object-fit:cover;display:block}
.mem .d{font-size:13px;color:var(--sub)}
.mem .n{font-size:15px;font-weight:700;margin:2px 0 4px}
.mem p{margin:0;font-size:13px;color:var(--sub);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.diary{display:grid;grid-template-columns:minmax(0,1fr) 78px;background:var(--soft);border-radius:12px;overflow:hidden}
.diary .tx{padding:12px 10px 12px 14px;display:grid;grid-template-columns:22px minmax(0,1fr);gap:8px}
.diary .pen{border:0;background:none;padding:0;width:22px;height:30px;color:var(--ink)}
.diary q{display:block;font-weight:700;font-size:15px;line-height:1.4;quotes:"\201C" "\201D";white-space:pre-line}
.diary p{margin:8px 0 0;font-size:12.5px;color:var(--sub);line-height:1.5}
.diary img{width:78px;height:100%;object-fit:cover;display:block}
.note-s{font-size:13px;color:var(--sub);padding:10px 20px 0;margin:0}

/* 아카이브 */
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin:4px 20px 0;background:var(--esp);color:var(--on-esp);border-radius:18px;padding:16px 6px}
.stats div{text-align:center}
.stats b{display:block;font-size:22px;font-weight:800;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 4px}
.stats small{font-size:13px;opacity:.75}
.tools{padding:14px 20px 4px;display:grid;gap:10px}
.search{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:0 14px;min-height:48px}
.search input{border:0;background:none;outline:none;flex:1;font-size:16px;min-height:46px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chip{flex:none;border:1px solid var(--line);background:var(--card);border-radius:99px;padding:0 14px;min-height:38px;font-size:14px}
.chip[aria-pressed=true]{background:var(--rust);color:#fff;border-color:var(--rust)}
.feed{padding:10px 20px;display:grid;gap:12px}
.rec{background:var(--card);border-radius:18px;overflow:hidden;border:1px solid var(--line);display:grid;grid-template-columns:108px minmax(0,1fr);text-align:left;padding:0;width:100%}
.ph{aspect-ratio:3/4;background:var(--line);display:block;width:100%;height:100%;object-fit:cover}
.rec .body{padding:12px 14px;display:flex;flex-direction:column;gap:3px}
.rec h3{margin:0;font-size:16px;line-height:1.3}
.menu{font-size:14px;color:var(--sub)}
.note{font-size:14px;margin:3px 0 0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.meta{margin-top:auto;font-size:13px;color:var(--sub);display:flex;gap:6px;flex-wrap:wrap;padding-top:6px}
.tag{background:var(--soft);border-radius:6px;padding:1px 7px}
.empty{text-align:center;color:var(--sub);padding:30px 10px;font-size:14px}
.add-row{padding:14px 20px 0}
.add{width:100%;min-height:48px;border-radius:99px;border:1.5px solid var(--rust);background:none;color:var(--rust-ink);font-weight:700}

/* 지도·더보기 */
.page-h{padding:4px 20px 0}
.page-h h2{margin:0;font-size:22px}
.page-h p{margin:4px 0 0;color:var(--sub);font-size:14px}
.area{margin:14px 20px 0;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 16px}
.area-top{display:flex;align-items:center;gap:10px}
.area-top svg{flex:none;color:var(--rust)}
.area-top span{margin-left:auto;color:var(--sub);font-size:14px;white-space:nowrap}
.area ul{margin:8px 0 0;padding:0 0 0 30px;font-size:14px;color:var(--sub)}
.menu-list{margin:16px 20px 0;background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.menu-list button,.menu-list label{display:flex;align-items:center;justify-content:space-between;width:100%;min-height:56px;padding:0 16px;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;font-size:16px;margin:0;cursor:pointer;position:relative}
.menu-list>*:last-child{border-bottom:0}
.menu-list .danger{color:#c0392b}
.menu-list input{position:absolute;inset:0;opacity:0;cursor:pointer}

/* 탭바 */
nav.tabs{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;background:var(--bg);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,minmax(0,1fr));padding:8px 0 calc(10px + env(safe-area-inset-bottom));z-index:6}
.tab{border:0;background:none;display:grid;justify-items:center;gap:6px;font-size:12px;color:var(--sub);min-height:56px;padding:4px 0}
.tab svg{width:30px;height:30px;color:var(--ink)}
.tab.on,.tab.on svg{color:var(--rust-ink)}

/* 시트·토스트 */
.sheet-bg{position:fixed;inset:0;background:rgba(20,12,8,.45);display:none;z-index:10;align-items:flex-end;justify-content:center}
.sheet-bg.on{display:flex}
.sheet{background:var(--bg);width:100%;max-width:430px;max-height:92vh;overflow-y:auto;border-radius:24px 24px 0 0;padding:10px 20px 24px;animation:up .28s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
@media(prefers-reduced-motion:reduce){.sheet{animation:none}.cta{transition:none}}
.grip{width:40px;height:5px;border-radius:9px;background:var(--line);margin:0 auto 14px}
.sheet h2{margin:0 0 14px;font-size:20px}
label.l{display:block;font-size:14px;font-weight:500;margin:12px 0 6px}
.f{width:100%;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:11px 12px;font-size:16px;min-height:46px}
textarea.f{min-height:80px;resize:vertical}
.rate-in{display:flex;align-items:center;gap:12px}
.rate-in input{flex:1;accent-color:var(--rust);min-height:44px}
.rate-in b{font-size:18px;min-width:2.2em;text-align:right}
.drop{display:grid;place-items:center;border:1.5px dashed var(--line);border-radius:14px;min-height:120px;color:var(--sub);font-size:14px;overflow:hidden;position:relative;background:var(--card)}
.drop img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.drop input{position:absolute;inset:0;opacity:0;cursor:pointer}
.row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.tagpick{display:flex;flex-wrap:wrap;gap:6px}
.btns{display:flex;gap:8px;margin-top:20px}
.btn{flex:1;min-height:50px;border-radius:99px;border:1px solid var(--line);background:var(--card);font-weight:700}
.btn.pri{background:var(--rust);color:#fff;border-color:var(--rust)}
.btn.del{flex:none;padding:0 18px;color:#c0392b}
.detail-img{width:calc(100% + 40px);margin:-10px -20px 16px;aspect-ratio:4/3;object-fit:cover;display:block;border-radius:24px 24px 0 0}
.toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:var(--esp);color:var(--on-esp);border-radius:12px;padding:10px 10px 10px 16px;display:none;align-items:center;gap:12px;font-size:14px;z-index:20;white-space:nowrap}
.toast.on{display:flex}
.toast button{background:none;border:0;color:#f0a58e;font-weight:700;min-height:36px;padding:0 8px}

/* 새 기록 화면 */
.editor{position:fixed;inset:0;z-index:12;display:none;justify-content:flex-start;background:rgba(20,12,8,.35)}
.editor.on{display:flex}
.editor>*{width:100%;max-width:430px;background:var(--bg);flex-shrink:0}
.editor{flex-direction:column;align-items:center;overflow-y:auto}
.editor{animation:fade .2s ease-out}@keyframes fade{from{opacity:0}}
@media(prefers-reduced-motion:reduce){.editor{animation:none}}
.ed-h{position:sticky;top:0;z-index:2;display:grid;grid-template-columns:44px 1fr 44px;align-items:center;padding:12px 18px 10px;border-bottom:1px solid var(--sub)}
.ed-h h2{grid-column:2;margin:0;text-align:center;font-size:21px;font-weight:800;letter-spacing:.2em;padding-left:.2em}
.x{width:44px;height:44px;border:0;background:none;display:grid;place-items:center;padding:0;color:#fff}
.x svg{width:24px;height:24px;padding:6px;background:var(--esp);color:var(--on-esp);border-radius:50%;box-sizing:border-box}
.ed-b{padding:6px 20px 10px;flex:1}
.el{display:block;font-size:15px;font-weight:700;margin:18px 0 8px}
.el small{font-weight:400;color:var(--sub);font-size:13px;margin-left:4px}
.box{display:flex;align-items:center;gap:8px;border:1px solid var(--sub);border-radius:10px;background:var(--card);min-height:44px;padding:0 6px 0 12px;position:relative}
.box input{border:0;background:none;outline:none;flex:1;font-size:16px;min-height:42px}
.box:focus-within{border-color:var(--rust);box-shadow:0 0 0 2px rgba(185,75,50,.15)}
.clr{width:36px;height:36px;border:0;background:none;padding:0;display:grid;place-items:center;font-size:0}
.clr::before{content:"×";width:18px;height:18px;border-radius:50%;background:var(--off);color:var(--card);font-size:15px;line-height:18px;font-weight:700}
.date{cursor:pointer;padding-right:12px}.date span:first-of-type{flex:1;font-weight:500}
.date input{position:absolute;inset:0;opacity:0;width:100%;cursor:pointer}
.ph-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.pt{position:relative;aspect-ratio:215/157;border-radius:10px;overflow:hidden;background:var(--line);display:block;margin:0}
.pt img{width:100%;height:100%;object-fit:cover;display:block}
.px{position:absolute;top:4px;right:4px;width:32px;height:32px;border:0;background:none;padding:0;font-size:0;display:grid;place-items:center}
.px::before{content:"×";width:18px;height:18px;border-radius:50%;background:#fff;color:#1f1a17;font-size:15px;line-height:17px;font-weight:700}
.pt.add{background:none;border:1.5px dashed var(--sub);display:grid;place-items:center;cursor:pointer;color:var(--sub);font-size:40px;font-weight:200}
.pt.add input{position:absolute;inset:0;opacity:0;cursor:pointer}
.stars-in{display:flex;align-items:center;justify-content:center;gap:2px;padding:0 4px;border-radius:10px}
.stars-in button{border:0;background:none;padding:0;width:48px;height:48px}
.big{font-size:38px;line-height:1;background:linear-gradient(90deg,var(--rust) var(--p),var(--off) var(--p));-webkit-background-clip:text;background-clip:text;color:transparent}
.stars-in b{font-size:18px;margin-left:12px}.stars-in .of{color:var(--off);font-weight:700;font-size:18px;margin-left:6px;white-space:nowrap}
.tag3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px 18px;padding:0 10px}
.tag3 .tg{min-height:34px}
.memo{border:1px solid var(--sub);border-radius:10px;background:var(--card);padding:10px 12px 6px}
.memo:focus-within{border-color:var(--rust)}
.memo textarea{width:100%;border:0;outline:none;background:none;resize:none;min-height:66px;font-size:15px;line-height:1.75}
.memo small{display:block;text-align:right;font-size:11px;color:var(--sub)}
.err{color:var(--rust-ink);font-size:14px;margin:12px 0 0}
.ed-f{position:sticky;bottom:0;padding:12px 20px calc(16px + env(safe-area-inset-bottom));background:var(--bg)}
.save{width:100%;min-height:46px;border:0;border-radius:99px;background:var(--rust);color:#fff;font-size:16px;font-weight:500}
.only3{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:14px 20px 0;padding:0 4px 0 14px;min-height:48px;background:var(--soft);border-radius:12px;font-size:14px;font-weight:700}
.clr[hidden],.icon-btn[hidden],.only3[hidden],.tools[hidden],header[hidden],.ar-search[hidden]{display:none}
.only3 button{border:0;background:none;color:var(--rust-ink);font-size:13px;min-height:44px;padding:0 10px;white-space:nowrap}
.ar-top{position:sticky;top:0;z-index:4;background:var(--bg)}
.ar-h{display:grid;grid-template-columns:48px 1fr 48px;align-items:center;padding:8px 10px;border-bottom:1px solid var(--sub)}
.ar-h h2{margin:0;text-align:center;font-size:21px;font-weight:800}
#favBtn.on{color:var(--rust-ink)}
.ar-tabs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr)) 52px;margin:0 20px;border-bottom:1px solid var(--sub)}

{

const SAMPLE=[];

const load=(k,d)=>{try{const v=JSON.parse(get(k));return v??d}catch(e){return d}};

{const ids=new Set(SAMPLE.map(x=>x.id));if(recs.some(r=>/^s\d+$/.test(r.id))){recs=recs.filter(r=>!/^s\d+$/.test(r.id)||ids.has(r.id)).map(r=>ids.has(r.id)?{...SAMPLE.find(x=>x.id===r.id),fav:r.fav??SAMPLE.find(x=>x.id===r.id).fav}:r);SAMPLE.forEach(x=>{if(!recs.some(r=>r.id===x.id))recs.push(x)})}}
{const ids=new Set(saved.map(x=>x.id));if(saved.some(x=>/^v\d$/.test(x.id)))SAMPLE_SAVED.forEach(x=>{if(!ids.has(x.id))saved.push(x)})}

const STAR='M12 2.6l2.9 6 6.6.9-4.8 4.6 1.2 6.5L12 17.5l-5.9 3.1 1.2-6.5-4.8-4.6 6.6-.9z';

function shrink(file,m){
  return new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>{const im=new Image();im.onload=()=>{const s=Math.min(1,m/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=im.width*s;c.height=im.height*s;c.getContext('2d').drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.75))};im.onerror=rej;im.src=fr.result};fr.onerror=rej;fr.readAsDataURL(file)});
}
